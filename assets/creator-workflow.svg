<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">The creator workflow</title>
<desc id="d">Five connected stages: plan and research, write and design, produce and edit, publish and distribute, measure and improve.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#19123b"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122744"/><stop offset="1" stop-color="#211b4a"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d5ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8c7aff"/></marker>
 <style>
 .h{font:700 48px Arial,sans-serif;fill:#f4f7ff}.sub{font:400 22px Arial,sans-serif;fill:#b7c6df}
 .num{font:700 18px Arial,sans-serif;fill:#061426}.ct{font:700 25px Arial,sans-serif;fill:#fff}.body{font:400 18px Arial,sans-serif;fill:#c5d3e7}.tag{font:600 15px Arial,sans-serif;fill:#91e8ff;letter-spacing:1px}
 </style>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/>
<circle cx="1400" cy="110" r="220" fill="#6034c5" opacity=".12"/><circle cx="80" cy="800" r="280" fill="#167bb8" opacity=".12"/>
<text x="100" y="95" class="tag">THE CREATOR WORKFLOW</text>
<text x="100" y="155" class="h">From first idea to measurable growth</text>
<text x="100" y="198" class="sub">A connected toolkit for planning, producing, publishing and improving content.</text>
<g transform="translate(90 290)">
 <rect width="430" height="195" rx="24" fill="url(#card)" stroke="#39d5ff" stroke-width="2"/>
 <circle cx="55" cy="52" r="25" fill="url(#accent)"/><text x="55" y="59" text-anchor="middle" class="num">01</text>
 <text x="100" y="61" class="ct">Plan &amp; Research</text>
 <text x="35" y="112" class="body">Audience • Brand • Ideas • Trends</text><text x="35" y="145" class="body">Content pillars • Calendar • Strategy</text>
 <text x="35" y="178" class="tag">START WITH THE WHY</text>
</g>
<g transform="translate(585 290)">
 <rect width="430" height="195" rx="24" fill="url(#card)" stroke="#6e9cff" stroke-width="2"/>
 <circle cx="55" cy="52" r="25" fill="url(#accent)"/><text x="55" y="59" text-anchor="middle" class="num">02</text>
 <text x="100" y="61" class="ct">Write &amp; Design</text>
 <text x="35" y="112" class="body">Hooks • Scripts • Storyboards</text><text x="35" y="145" class="body">Thumbnails • Graphics • Brand voice</text>
 <text x="35" y="178" class="tag">MAKE THE IDEA CLEAR</text>
</g>
<g transform="translate(1080 290)">
 <rect width="430" height="195" rx="24" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
 <circle cx="55" cy="52" r="25" fill="url(#accent)"/><text x="55" y="59" text-anchor="middle" class="num">03</text>
 <text x="100" y="61" class="ct">Produce &amp; Edit</text>
 <text x="35" y="112" class="body">Video • Motion • Image • Audio</text><text x="35" y="145" class="body">Captions • Sound design • Quality checks</text>
 <text x="35" y="178" class="tag">FINISH THE ASSET</text>
</g>
<path d="M525 387H575M1020 387H1070" stroke="#8c7aff" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(340 600)">
 <rect width="430" height="195" rx="24" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
 <circle cx="55" cy="52" r="25" fill="url(#accent)"/><text x="55" y="59" text-anchor="middle" class="num">04</text>
 <text x="100" y="61" class="ct">Publish &amp; Distribute</text>
 <text x="35" y="112" class="body">YouTube • TikTok • Instagram</text><text x="35" y="145" class="body">Metadata • Scheduling • Repurposing</text>
 <text x="35" y="178" class="tag">REACH THE RIGHT PEOPLE</text>
</g>
<g transform="translate(835 600)">
 <rect width="430" height="195" rx="24" fill="url(#card)" stroke="#39d5ff" stroke-width="2"/>
 <circle cx="55" cy="52" r="25" fill="url(#accent)"/><text x="55" y="59" text-anchor="middle" class="num">05</text>
 <text x="100" y="61" class="ct">Measure &amp; Improve</text>
 <text x="35" y="112" class="body">Analytics • Retention • Experiments</text><text x="35" y="145" class="body">Community • Monetization • Iteration</text>
 <text x="35" y="178" class="tag">LEARN AND REPEAT</text>
</g>
<path d="M1295 485V545H555V585" fill="none" stroke="#8c7aff" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M770 700H825" stroke="#8c7aff" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1050 795V820H60V387H80" fill="none" stroke="#39d5ff" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
<text x="800" y="878" text-anchor="middle" class="sub">Human review stays in control • Tool access depends on each skill's requirements</text>
</svg>