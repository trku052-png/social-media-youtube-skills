 <text x="0" y="86" fill="#f8fbff" font-family="Arial,sans-serif" font-size="58" font-weight="800">SOCIAL MEDIA</text>
 <text x="0" y="158" fill="url(#blue)" font-family="Arial,sans-serif" font-size="72" font-weight="900">YOUTUBE</text>
