<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Social Media, YouTube and Creative Production Skills</title>
<desc id="desc">A modern creator workspace with a video editing timeline, camera, microphone, social media tiles and analytics graphics.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset=".55" stop-color="#111b3b"/><stop offset="1" stop-color="#26114c"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35d4ff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff416c"/><stop offset="1" stop-color="#ff8b5d"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="560" rx="30" fill="url(#bg)"/>
